#
# Робот-питомец: ESP32 DevKit 30 выводов + L298N + JGA25-370B 1:34 + LD19
# Комментарии - только с начала строки, после значений писать нельзя.
# Исходный конфиг Kaia лежит рядом: config_mini_bdc_30p.yaml
#
board:
  manufacturer: DIY
  model: PET-200 ESP32 DevKit 30p, L298N
  version: v0.1
#
# Выводы - как у платы Maker's Pet BDC-30P, она тоже под DevKit 30 выводов.
# lidar.gpio.tx - сюда приходит провод TX лидара. У LD19 провод PWM
# посадить на землю (скорость держит сам), вывод en не подключается.
#
lidar:
  gpio:
    tx: 35
    rx: 27
    pwm: 13
    en: 32
led:
  system:
    driver:
      type: direct
      gpio: 2
      invert: false
button:
  boot:
    gpio: 0
    invert: true
monitor:
  gpio:
    tx: 1
#
# L298N: перемычки ENA/ENB стоят (или ими управляет ESP32-C3), in1/in2 -
# выводы IN1/IN2 (левый мотор) и IN3/IN4 (правый). Перемычку 5 В снять.
# Энкодеры питать от 3,3 В. Выводы 39 и 36 без внутренней подтяжки:
# если счёт не идёт - резисторы 10 кОм с каждого на 3,3 В.
#
motor:
  driver:
    type: IN1_IN2
  encoder:
    type: AB_QUAD
  left:
    encoder:
      gpio:
        a: 39
        b: 36
    driver:
      gpio:
        in1: 26
        in2: 25
  right:
    encoder:
      gpio:
        a: 17
        b: 16
    driver:
      gpio:
        in1: 23
        in2: 22
#
# Батарея 4S. Делитель: плюс батареи - 100 кОм - вывод 33 - 10 кОм - земля,
# параллельно нижнему резистору 0,1 мкФ. attenuation = (100+10)/10 = 11.
# Подогнать по мультиметру: attenuation = старое * U_мультиметр / U_в_логе.
#
adc:
  battery:
    attenuation: 11.0
    gpio: 33
    voltage:
      full: 16.8
      empty: 12.8

#
# Защиты (нет в исходной прошивке Kaia). 0 отключает проверку.
# cmd_vel.timeout - сек без команд с ПК до остановки.
# stall - мотор под напряжением (pwm_min, доля 0..1), а колесо за timeout сек
# прошло меньше, чем при rpm_min об/мин: стоп, hold сек команды не принимаются.
# battery, вольты: low - сообщить; stop - моторы и лидар выключены;
# sleep - плата засыпает и раз в wake сек проверяет, зарядили ли.
# Вверх по ступеням - только при пороге + hysteresis. delay - сек подряд.
#
safety:
  cmd_vel:
    timeout: 0.5
  stall:
    timeout: 1.0
    rpm_min: 3.0
    pwm_min: 0.15
    hold: 2.0
  battery:
    low: 14.0
    stop: 13.2
    sleep: 12.8
    hysteresis: 0.5
    delay: 3.0
    wake: 60

#
# Периферия и шасси
#
lidar:
  model: LDROBOT LD19
  scan:
    freq:
      target: 10.0
monitor:
  baud: 115200
#
# track - расстояние между серединами колёс, м (по чертежу, перемерить).
# diameter - колесо 65 мм.
#
base:
  wheel:
    track: 0.163
    diameter: 0.065
    accel:
      max: 1.0
#
# Мотор 205 об/мин без нагрузки при 12 В; max взят с запасом.
# ppr - импульсов одного канала на оборот колеса: 11 * 34 = 374 (измерить).
#
motor:
  rpm:
    max: 160
  driver:
    pid:
      period: 0.03
      kp: 0.001
      ki: 0.003
      kd: 0
      kpm: 0
  encoder:
    ppr: 374
