; Pet fork build (Arduino core 2.0.x / ESP-IDF 4.4, IDF 5 is not supported).
;   pio run              - build
;   pio run -t upload    - flash firmware
;   pio run -t uploadfs  - flash kaiaai-esp32/data (config.yaml, web page)
[platformio]
src_dir = kaiaai-esp32
data_dir = kaiaai-esp32/data

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_extra_dirs = libraries
; micro_ros_kaia ships a precompiled library
build_flags = -Llibraries/micro_ros_kaia/src/esp32 -lmicroros
